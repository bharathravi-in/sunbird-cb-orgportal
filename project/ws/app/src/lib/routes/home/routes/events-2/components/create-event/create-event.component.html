<div class="w-full flex flex-column events">
  <div class="breadcrum flex items-center justify-between">
    <div class="flex gap-2 items-center">
      <mat-icon class="back-arrow" (click)="openConforamtionPopup()">arrow_back</mat-icon>
      <span class="event-text">Event</span>
      <mat-icon class="chevron-arrow">chevron_right</mat-icon>
      <span class="event-builder-text">Event Builder</span>
    </div>
    <div class="flex gap-4">
      <ng-container *ngIf="openMode === 'edit' && pathUrl !== 'past'">
        <button mat-raised-button class="flex justify-center items-center save-and-exit" (click)="saveAndExit()">
          Save Draft & Exit</button>
      </ng-container>
      <ng-container
        *ngIf="openMode === 'edit' && pathUrl === 'past' && edf?.typeofEvent?.value?.toLowerCase() !== 'live'">
        <button mat-raised-button class="flex justify-center items-center save-and-exit" (click)="saveAndPublish()">Save
        </button>
      </ng-container>
      <ng-container *ngIf="currentStepperIndex > 0">
        <button mat-raised-button class="flex justify-center items-center next-btn"
          (click)="moveToPreviousForm()">Previous</button>
      </ng-container>
      <ng-container
        *ngIf="selectedStepperLable !== 'Preview' && selectedStepperLable !== 'Add Competency' && currentStepperIndex < (stepper?.steps?.length - 1)">
        <button mat-raised-button class="flex justify-center items-center next-btn"
          (click)="moveToNextForm()">Next</button>
      </ng-container>
      <ng-container *ngIf="!showPreview && selectedStepperLable === 'Add Competency' && pathUrl !== 'past'">
        <button mat-raised-button class="flex items-center publish-btn" (click)="preview()">Preview</button>
      </ng-container>
      <ng-container
        *ngIf="(selectedStepperLable === 'Event Setup' ||selectedStepperLable === 'Preview' || selectedStepperLable === 'Add Competency') && openMode === 'edit' && pathUrl !== 'past'">
        <button mat-raised-button class="flex items-center publish-btn" (click)="publish()">Send to Publisher</button>
      </ng-container>
      <ng-container
        *ngIf="pathUrl === 'past' && edf?.typeofEvent?.value?.toLowerCase() === 'live' && selectedStepperLable === 'Event Setup'">
        <button mat-raised-button class="flex items-center publish-btn" (click)="updatePostEvent()">
          Update Post Event </button>
      </ng-container>
    </div>
  </div>

  <mat-stepper [displayDefaultIndicatorType]="false" labelPosition="bottom" [selectedIndex]="currentStepperIndex"
    (selectionChange)="onSelectionChange($event)" class="mx-10" #stepper><!-- add [linear]="true" -->
    <!-- Always show numbers -->
    <ng-template matStepperIcon="number" let-index="index">
      {{ index + 1 }}
    </ng-template>

    <ng-template matStepperIcon="edit" let-index="index">
      {{ index + 1 }}
    </ng-template>

    <ng-template matStepperIcon="done" let-index="index">
      {{ index + 1 }}
    </ng-template>
    <mat-step label="Basic Details" [stepControl]="eventDetailsForm">
      <ng-template matStepLabel>Basic Details</ng-template>
      <ws-app-event-basic-details [eventStatus]="eventStatus" [eventDetails]="eventDetailsForm" [openMode]="openMode"
        [userProfile]="userProfile" [openTab]="pathUrl"
        [eventCategoriesList]="eventCategoriesList"></ws-app-event-basic-details>
    </mat-step>

    <!-- <mat-step>
      <ng-template matStepLabel>Add Speaker</ng-template>
      <ws-app-speakers [speakersList]="speakersList" [openMode]="openMode"
        [userProfile]="userProfile"></ws-app-speakers>
    </mat-step> -->
    <ng-container *ngIf="enableCourseLinking && edf?.typeofEvent?.value?.toLowerCase() === 'live' && contentLoaded">
      <mat-step label="Course Linking" [stepControl]="courseSelectionForm">
        <ng-template matStepLabel>Course Linking</ng-template>
        <ws-app-course-listing [courseDetails]="courseSelectionForm?.value?.selectedCourse"
          [eventDetailsData]="eventDetails" [openMode]="openMode" [openTab]="pathUrl" [eventStatus]="eventStatus"
          (courseSelected)="onCourseSelected($event)"></ws-app-course-listing>
      </mat-step>
    </ng-container>

    <ng-container *ngIf="edf?.typeofEvent?.value?.toLowerCase() === 'live'">
      <mat-step label="Event Setup">
        <ng-template matStepLabel>Event Setup</ng-template>
        <ws-app-event-details [eventDetailsData]="eventDetails" [openMode]="openMode" [openTab]="pathUrl"
          [eventStatus]="eventStatus" [eventCategory]="edf?.eventCategory?.value"
          (preEventFormReady)="onPreEventFormReady($event)"
          (postEventFormReady)="onPostEventFormReady($event)"></ws-app-event-details>
      </mat-step>
    </ng-container>

    <ng-container *ngIf="edf?.typeofEvent?.value?.toLowerCase() === 'record'">
      <mat-step label="Add Material">
        <ng-template matStepLabel>Add Material</ng-template>
        <ws-app-event-materials [materialsList]="materialsList" [openMode]="openMode" [openTab]="pathUrl"
          [eventCategory]="edf?.eventCategory?.value"></ws-app-event-materials>
      </mat-step>
    </ng-container>

    <mat-step label="Add Competency" *ngIf="edf?.typeofEvent?.value?.toLowerCase() === 'record'">
      <ng-template matStepLabel>Add Competency</ng-template>
      <ws-app-event-competencies [competenciesList]="competencies" [openMode]="openMode" [openTab]="pathUrl"
        (addCompetencies)="addCompetencies($event)"></ws-app-event-competencies>
    </mat-step>

    <ng-container *ngIf="showPreview">
      <mat-step label="Preview">
        <ng-template matStepLabel>Preview</ng-template>
        <ws-app-events-preview [event]="updatedEventDetails"></ws-app-events-preview>
      </mat-step>
    </ng-container>
  </mat-stepper>
</div>
